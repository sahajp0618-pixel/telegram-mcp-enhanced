[project]
name = "telegram-mcp-enhanced"
version = "1.0.0"
description = "Security- and reliability-hardened MCP server for Telegram, downstream of dryeab/mcp-telegram"
readme = "README.md"
requires-python = ">=3.10"
# The original mcp-telegram implementation is by Yeabsira Driba; the security
# and reliability layer in this downstream project is maintained separately.
authors = [{ name = "Yeabsira Driba" }]
maintainers = [{ name = "Sahaj Patel" }]
keywords = [
    "mcp",
    "llm",
    "telegram",
    "automation",
    "security",
    "prompt-injection",
    "rate-limiting",
]
license = { text = "MIT" }
dependencies = [
    "cryptg>=0.5.0.post0",
    "mcp[cli]>=1.6.0",
    "pydantic>=2.11.1",
    "pydantic-settings>=2.8.1",
    "rich>=14.0.0",
    "telethon>=1.39.0",
    "tomli>=2.0.1; python_version < '3.11'",
    "typer>=0.15.2",
    "xdg-base-dirs>=6.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The import package keeps upstream's name so patches merge cleanly and
# existing MCP client configuration keeps working.
packages = ["src/mcp_telegram"]

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "pyright>=1.1.389",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.16.0",
]

[project.scripts]
telegram-mcp-enhanced = "mcp_telegram:app"
mcp-telegram = "mcp_telegram:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error::RuntimeWarning"]

[tool.pyright]
include = ["src/mcp_telegram/**/*.py"]
venvPath = "."
venv = ".venv"
strict = ["src/mcp_telegram/**/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[tool.ruff.lint.isort]
case-sensitive = true
known-first-party = ["mcp_telegram"]
lines-between-types = 1
order-by-type = false

[tool.ruff]
line-length = 88
target-version = "py310"

[project.urls]
Repository = "https://github.com/sahajp0618-pixel/telegram-mcp-enhanced"
Issues = "https://github.com/sahajp0618-pixel/telegram-mcp-enhanced/issues"
"Upstream project" = "https://github.com/dryeab/mcp-telegram"
